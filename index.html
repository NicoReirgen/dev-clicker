<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dev Clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="jeu.js"></script>
    <script defer src="alpine.min.js"></script>
  </head>
  <body>
    <!--
      Dev Clicker : la page du jeu.
      - x-data="jeu()" relie toute la balise main aux données et fonctions de jeu.js.
      - Chaque section est une partie du jeu : compteur, boutique, succès.
      - Les attributs Alpine (x-text, @click, :disabled, x-for) affichent et mettent à jour la page.
      - Le style est dans style.css, les couleurs tout en haut de ce fichier.
      Pour changer le titre du jeu, modifie la balise h1 juste en dessous.
    -->
    <main x-data="jeu()">
      <header>
        <h1>Dev Clicker</h1>
        <p class="slogan">Écris du code, recrute ton équipe, deviens une légende.</p>
      </header>

      <section class="zone-clic">
        <p class="total"><span x-text="formater(lignes)"></span> <span x-text="unite"></span></p>
        <p class="rythme">
          <span x-text="formater(parSeconde)"></span> par seconde ·
          <span x-text="formater(parClic)"></span> par clic
        </p>
        <p class="alerte" x-show="bugs.length > 0" x-text="'🐛 ' + bugs.length + ' bug(s) : production divisée par ' + malus"></p>
        <!-- Les curseurs entourent la touche et cliquent chacun leur tour. -->
        <div class="orbite">
          <template x-for="(c, i) in curseurs" :key="i">
            <span
              class="curseur"
              :style="{
                '--angle': (i * 360 / curseurs.length) + 'deg',
                '--delai': (i / curseurs.length) + 's',
                '--couleur-curseur': c.couleur
              }"
            >
              <span class="pointe">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 2.5 L5 19.5 L9.6 15.3 L12.6 21.8 L15.4 20.6 L12.4 14.2 L18.6 14.2 Z" />
                </svg>
              </span>
              <small x-show="c.valeur > 1" x-text="'+' + c.valeur"></small>
            </span>
          </template>
          <button class="gros-bouton" @click="cliquer($event)" x-text="iconeClic" aria-label="Coder"></button>
        </div>
      </section>

      <section class="boutique">
        <h2>Boutique</h2>
        <template x-for="amelioration in ameliorations" :key="amelioration.id">
          <button class="article" @click="acheter(amelioration)" :disabled="lignes < amelioration.prix">
            <span class="icone" x-text="amelioration.icone"></span>
            <span class="details">
              <strong x-text="amelioration.nom"></strong>
              <small x-text="description(amelioration)"></small>
            </span>
            <span class="prix" x-text="formater(amelioration.prix)"></span>
            <span class="nombre" x-text="amelioration.nombre"></span>
          </button>
        </template>
      </section>

      <section class="trophees">
        <h2>Succès <span x-text="succesObtenus.length + ' / ' + succes.length"></span></h2>
        <ul>
          <template x-for="s in succes" :key="s.id">
            <li :class="{ obtenu: succesObtenus.includes(s.id) }" x-text="s.nom"></li>
          </template>
        </ul>
      </section>

      <button class="recommencer" @click="recommencer()">Recommencer à zéro</button>

      <p class="notification" x-show="notification" x-transition x-text="notification" aria-live="polite"></p>

      <template x-for="b in bulles" :key="b.id">
        <span class="bulle" :style="{ left: b.x + 'px', top: b.y + 'px' }" x-text="b.texte"></span>
      </template>
      <!-- Le mini-jeu de débogage : clique sur un bug pour le corriger. -->
      <template x-for="b in bugs" :key="b.id">
        <button class="bug" :style="{ left: b.x + '%', top: b.y + '%' }" @click="corrigerBug(b)" aria-label="Corriger le bug">🐛</button>
      </template>
    </main>
  </body>
</html>
